    <div class="heading">

      <h2>Useful Research Databases</h2>

      <p>
        Here are some important resources that biotechnology students
        should gradually become familiar with.
      </p>

    </div>


    <div class="content">

      <h3>🧬 NCBI</h3>

      <p>
        NCBI provides access to a large collection of biological
        information, including nucleotide sequences, proteins,
        genomes, scientific literature, and other research resources.
      </p>

      <ul>
        <li>Search DNA and RNA sequences</li>
        <li>Explore genes and genomes</li>
        <li>Find protein information</li>
        <li>Search scientific literature</li>
      </ul>

      <div class="tip">
        <strong>Best for beginners:</strong>
        Start with NCBI when you need to search for a gene,
        nucleotide sequence, protein, or research article.
      </div>

    </div>


    <div class="content">

      <h3>🧪 UniProt</h3>

      <p>
        UniProt is a major resource for protein sequence and
        functional information. It helps researchers explore
        protein names, functions, sequences, and annotations.
      </p>

      <ul>
        <li>Search protein sequences</li>
        <li>Study protein functions</li>
        <li>Explore protein annotations</li>
        <li>Compare information about proteins</li>
      </ul>

      <div class="tip">
        <strong>Student use:</strong>
        If your assignment involves understanding a protein,
        UniProt is an excellent place to begin.
      </div>

    </div>


    <div class="content">

      <h3>🧩 Protein Data Bank (PDB)</h3>

      <p>
        The Protein Data Bank provides access to three-dimensional
        structural information for proteins, nucleic acids,
        and other biological macromolecules.
      </p>

      <ul>
        <li>Explore molecular structures</li>
        <li>View three-dimensional models</li>
        <li>Study protein structure</li>
        <li>Explore protein-ligand interactions</li>
      </ul>

    </div>


    <div class="content">

      <h3>📄 PubMed</h3>

      <p>
        PubMed is a widely used resource for searching biomedical
        and life-science research literature.
      </p>

      <ul>
        <li>Find research papers</li>
        <li>Search scientific topics</li>
        <li>Find review articles</li>
        <li>Explore previous research</li>
      </ul>

      <div class="tip">
        <strong>Research tip:</strong>
        Use specific keywords rather than very broad searches.
        For example, combine a biological process with an organism
        or experimental technique.
      </div>

    </div>


    <div class="content">

      <h3>🌍 Ensembl</h3>

      <p>
        Ensembl provides genome information and tools for exploring
        genes, genomic regions, variants, and other genomic features.
      </p>

      <ul>
        <li>Explore genomes</li>
        <li>Find genes and genomic regions</li>
        <li>Explore genetic variants</li>
        <li>Study genome annotations</li>
      </ul>

    </div>


    <div class="content">

      <h3>🧬 Gene Expression Resources</h3>

      <p>
        Gene expression databases can help researchers investigate
        how genes are expressed under different biological conditions,
        tissues, or experimental settings.
      </p>

      <div class="tip">
        <strong>Remember:</strong>
        Gene expression data can be complex. Always check the
        experimental design and metadata before interpreting results.
      </div>

    </div>

      <h2>How to Choose a Database</h2>

      <p>
        Start by identifying exactly what type of biological
        information you are looking for.
      </p>

    </div>


    <div class="content">

      <h3>Looking for a DNA Sequence?</h3>

      <p>
        Start with a nucleotide or sequence-focused resource.
        NCBI is a useful starting point for many sequence searches.
      </p>

    </div>


    <div class="content">

      <h3>Looking for Protein Information?</h3>

      <p>
        UniProt is useful for protein sequences, functions,
        annotations, and related information.
      </p>

    </div>


    <div class="content">

      <h3>Looking for a 3D Structure?</h3>

      <p>
        The Protein Data Bank is a major resource for exploring
        experimentally determined molecular structures.
      </p>

    </div>


    <div class="content">

      <h3>Looking for Research Papers?</h3>

      <p>
        PubMed is a useful starting point for searching
        biomedical and life-science literature.
      </p>

    </div>
