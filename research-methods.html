    <div class="section-heading">

      <h2>Important Biotechnology Methods</h2>

      <p>
        These are some of the major techniques students may encounter
        while studying biotechnology and life sciences.
      </p>

    </div>


    <div class="content-box">

      <h3>1. Polymerase Chain Reaction (PCR)</h3>

      <p>
        PCR is a molecular technique used to amplify a specific DNA region,
        producing many copies of the selected sequence.
      </p>

      <ul>
        <li>Denaturation separates the DNA strands.</li>
        <li>Annealing allows primers to bind to the target sequence.</li>
        <li>Extension allows DNA polymerase to synthesize new DNA.</li>
      </ul>

      <div class="example">

        <strong>Common applications:</strong>
        DNA analysis, research, diagnostics, cloning workflows,
        and detection of specific DNA sequences.

      </div>

    </div>


    <div class="content-box">

      <h3>2. Gel Electrophoresis</h3>

      <p>
        Gel electrophoresis is used to separate biological molecules,
        such as DNA fragments, according to properties such as size
        and electrical charge.
      </p>

      <div class="example">

        <strong>Common application:</strong>
        Comparing DNA fragment patterns after molecular experiments.

      </div>

    </div>


    <div class="content-box">

      <h3>3. DNA Sequencing</h3>

      <p>
        DNA sequencing determines the order of nucleotide bases
        in a DNA molecule or selected region.
      </p>

      <div class="example">

        <strong>Why it matters:</strong>
        Sequence information can help researchers study genes,
        mutations, genomes, and biological variation.

      </div>

    </div>


    <div class="content-box">

      <h3>4. Microscopy</h3>

      <p>
        Microscopy allows researchers to observe cells, tissues,
        microorganisms, and other structures that may not be
        visible to the unaided eye.
      </p>

      <ul>
        <li>Light microscopy</li>
        <li>Fluorescence microscopy</li>
        <li>Electron microscopy</li>
      </ul>

    </div>


    <div class="content-box">

      <h3>5. Cell Culture</h3>

      <p>
        Cell culture involves maintaining and studying cells under
        controlled laboratory conditions. It is widely used in
        biological and biomedical research.
      </p>

      <div class="example">

        <strong>Important:</strong>
        Cell culture requires appropriate sterile technique,
        suitable growth conditions, and proper laboratory procedures.

      </div>

    </div>


    <div class="content-box">

      <h3>6. Spectrophotometry</h3>

      <p>
        Spectrophotometry measures how much light a sample absorbs
        or transmits at selected wavelengths.
      </p>

      <div class="example">

        <strong>Common uses:</strong>
        Estimating concentrations of biological molecules,
        measuring optical density, and monitoring experimental samples.

      </div>

    </div>

  </section>


  <section class="section">

    <div class="section-heading">

      <h2>Choosing the Right Method</h2>

      <p>
        There is no single research method that works for every
        biological question.
      </p>

    </div>


    <div class="content-box">

      <h3>Start With the Research Question</h3>

      <p>
        Researchers first identify what they need to know.
        The research question then guides the selection of an
        appropriate method.
      </p>

    </div>


    <div class="content-box">

      <h3>Consider the Type of Data</h3>

      <p>
        Determine whether the study requires numerical measurements,
        images, sequences, descriptive observations, or another type
        of evidence.
      </p>

    </div>


    <div class="content-box">

      <h3>Consider Controls and Reliability</h3>

      <p>
        Appropriate controls, replication, standardized procedures,
        and careful measurement can help improve the reliability
        of experimental findings.
      </p>

    </div>


    <div class="content-box">

      <h3>Consider Safety and Ethics</h3>

      <p>
        Research methods must be selected and performed according
        to appropriate laboratory safety requirements, ethical
        standards, and institutional procedures.
      </p>

    </div>

  </section>


  <section class="section tip-section">

    <div class="tip-content">

      <h2>Remember</h2>

      <p>
        A good researcher does not choose a technique simply because
        it is advanced. The best method is the one that appropriately
        answers the research question while producing reliable,
        interpretable evidence.
      </p>

    </div>

  </section>
