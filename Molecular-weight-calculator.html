<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Molecular Weight Calculator | BioVerse Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f9fb;
      color: #1f2937;
    }

    header {
      background: #123b4a;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    header p {
      margin-top: 8px;
    }

    .tool-container {
      max-width: 700px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 120px;
      padding: 12px;
      border: 1px solid #d9e1e5;
      border-radius: 8px;
      font-size: 16px;
      resize: vertical;
    }

    .example {
      background: #f1f6f8;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
    }

    button {
      display: block;
      margin: 25px auto;
      padding: 13px 28px;
      border: none;
      border-radius: 8px;
      background: #123b4a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #result {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin: 25px 0;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #123b4a;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>Molecular Weight Calculator</h1>
    <p>Calculate the molecular weight of a compound from its formula.</p>
  </header>

  <main class="tool-container">

    <div class="example">
      <strong>How to use:</strong><br>
      Enter a chemical formula such as H2O, CO2, NaCl, or C6H12O6.
    </div>

    <div class="input-group">
      <label for="formula">Chemical Formula</label>
      <textarea id="formula" placeholder="e.g. H2O"></textarea>
    </div>

    <button onclick="calculateMolecularWeight()">
      Calculate Molecular Weight
    </button>

    <div id="result"></div>

    <a href="index.html#explore" class="back-link">
      ← Back to BioVerse Hub
    </a>

  </main>

  <script>
    const atomicWeights = {
      H: 1.008,
      C: 12.011,
      N: 14.007,
      O: 15.999,
      F: 18.998,
      Na: 22.990,
      Mg: 24.305,
      P: 30.974,
      S: 32.06,
      Cl: 35.45,
      K: 39.098,
      Ca: 40.078,
      Fe: 55.845,
      Cu: 63.546,
      Zn: 65.38
    };

    function calculateMolecularWeight() {

      const formula = document
        .getElementById("formula")
        .value
        .trim();

      const result = document.getElementById("result");

      if (formula === "") {
        result.textContent = "Please enter a chemical formula.";
        return;
      }

      const pattern = /([A-Z][a-z]?)(\d*)/g;

      let match;
      let total = 0;
      let position = 0;
      let valid = true;

      while ((match = pattern.exec(formula)) !== null) {

        if (match.index !== position) {
          valid = false;
          break;
        }

        const element = match[1];
        const amount = match[2] === "" ? 1 : parseInt(match[2]);

        if (!atomicWeights[element]) {
          valid = false;
          break;
        }

        total += atomicWeights[element] * amount;
        position = pattern.lastIndex;
      }

      if (position !== formula.length) {
        valid = false;
      }

      if (!valid) {
        result.textContent =
          "Formula not recognized. Please check the chemical formula.";
        return;
      }

      result.textContent =
        "Molecular Weight = " + total.toFixed(3) + " g/mol";
    }
  </script>

</body>
</html>
