<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BioVerse Hub | Learn. Practice. Explore. Grow.</title>

<meta name="description" content="BioVerse Hub is a student-friendly biotechnology platform for resources, practice, tools, courses, research, and career opportunities.">

<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"Segoe UI", Inter, Arial, sans-serif;
  background:#f4f6ff;
  color:#17213f;
  line-height:1.6;
  overflow-x:hidden;
}

a{
  text-decoration:none;
}


/* =========================
   NAVBAR
========================= */

nav{
  width:100%;
  padding:17px 7%;

  display:flex;
  justify-content:space-between;
  align-items:center;

  position:sticky;
  top:0;
  z-index:1000;

  background:rgba(8,13,32,.90);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border-bottom:1px solid rgba(255,255,255,.09);
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
  color:#61a8ff;
}

.logo span{
  color:#ff5fa2;
}

.nav-links{
  display:flex;
  gap:25px;
  list-style:none;
}

.nav-links a{
  color:#d9def1;
  font-size:14px;
  font-weight:700;
  transition:.25s ease;
}

.nav-links a:hover{
  color:#ff6ca8;
}


/* =========================
   HERO
========================= */

.hero{
  min-height:760px;
  padding:100px 7%;

  display:flex;
  align-items:center;

  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 76% 45%,
      rgba(48,108,255,.31),
      transparent 29%
    ),
    radial-gradient(
      circle at 90% 78%,
      rgba(255,58,140,.24),
      transparent 28%
    ),
    radial-gradient(
      circle at 18% 15%,
      rgba(239,68,68,.12),
      transparent 25%
    ),
    linear-gradient(
      135deg,
      #070c24 0%,
      #10183d 52%,
      #181232 100%
    );
}


/* HERO GRID */

.hero::before{
  content:"";

  position:absolute;
  inset:0;

  background-image:
    linear-gradient(
      rgba(255,255,255,.035) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.035) 1px,
      transparent 1px
    );

  background-size:50px 50px;

  mask-image:linear-gradient(
    to right,
    transparent,
    black 35%,
    black 82%,
    transparent
  );

  pointer-events:none;
}


/* HERO GLOWS */

.glow{
  position:absolute;
  border-radius:50%;
  filter:blur(10px);
  pointer-events:none;
}

.glow.one{
  width:240px;
  height:240px;

  background:rgba(49,110,255,.16);

  top:8%;
  right:18%;

  animation:floatGlow 7s ease-in-out infinite;
}

.glow.two{
  width:190px;
  height:190px;

  background:rgba(255,70,145,.14);

  bottom:5%;
  right:8%;

  animation:floatGlow 9s ease-in-out infinite reverse;
}

@keyframes floatGlow{

  0%,100%{
    transform:translate(0,0);
  }

  50%{
    transform:translate(20px,-25px);
  }
}


/* =========================
   HERO CONTENT
========================= */

.hero-content{
  width:55%;
  position:relative;
  z-index:10;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:9px;

  padding:9px 17px;

  border-radius:50px;

  color:#8fc4ff;

  background:rgba(76,130,255,.10);

  border:1px solid rgba(104,164,255,.25);

  font-size:13px;
  font-weight:800;

  margin-bottom:25px;

  box-shadow:
    0 8px 30px rgba(49,110,255,.12);
}

.badge::before{
  content:"✦";
  color:#ff5fa2;
}


/* HERO HEADING */

.hero h1{
  font-family:Georgia,"Times New Roman",serif;

  font-size:clamp(52px,7vw,88px);

  line-height:.96;

  letter-spacing:-4px;

  color:#ffffff;

  font-weight:800;

  font-style:italic;

  margin-bottom:27px;
}

.hero h1 span{
  font-family:"Segoe UI",Inter,Arial,sans-serif;

  font-style:normal;

  font-weight:950;

  background:
    linear-gradient(
      90deg,
      #58a6ff,
      #ff5fa2,
      #ff5b67
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;
}

.hero p{
  max-width:650px;

  color:#b9c3df;

  font-size:18px;

  line-height:1.8;

  margin-bottom:36px;
}


/* =========================
   BUTTONS
========================= */

.hero-buttons{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}

.btn{
  padding:14px 24px;

  border-radius:12px;

  font-size:14px;
  font-weight:800;

  transition:.3s ease;
}

.btn-primary{
  color:white;

  background:
    linear-gradient(
      135deg,
      #397bff,
      #e94f9b
    );

  box-shadow:
    0 12px 35px rgba(75,108,255,.28);
}

.btn-primary:hover{
  transform:translateY(-4px) scale(1.02);

  box-shadow:
    0 18px 45px rgba(233,79,155,.28);
}

.btn-secondary{
  color:#e3e8ff;

  border:1px solid rgba(255,255,255,.20);

  background:rgba(255,255,255,.06);

  backdrop-filter:blur(10px);
}

.btn-secondary:hover{
  transform:translateY(-4px);
  border-color:#ff5fa2;
}


/* =========================
   3D DNA VISUAL
========================= */

.hero-visual{
  position:absolute;

  width:460px;
  height:570px;

  right:4%;
  top:50%;

  transform:translateY(-50%);

  perspective:1100px;

  z-index:5;
}

.dna-stage{
  width:100%;
  height:100%;

  position:relative;

  transform-style:preserve-3d;

  animation:dnaFloat 6s ease-in-out infinite;
}

@keyframes dnaFloat{

  0%,100%{
    transform:
      translateY(0)
      rotateY(-7deg);
  }

  50%{
    transform:
      translateY(-18px)
      rotateY(7deg);
  }
}


/* DNA HELIX */

.dna{
  position:absolute;

  width:220px;
  height:450px;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  transform-style:preserve-3d;

  animation:
    dnaSpin 7s ease-in-out infinite;
}

@keyframes dnaSpin{

  0%,100%{
    transform:
      translate(-50%,-50%)
      rotateY(-16deg)
      rotateZ(-3deg);
  }

  50%{
    transform:
      translate(-50%,-50%)
      rotateY(16deg)
      rotateZ(3deg);
  }
}


/* CURVED STRANDS */

.dna::before,
.dna::after{
  content:"";

  position:absolute;

  top:0;

  width:62px;
  height:100%;

  border-radius:50%;

  background:transparent;

  transform-style:preserve-3d;
}


/* LEFT STRAND */

.dna::before{
  left:15px;

  border-left:9px solid #58a6ff;

  box-shadow:
    -2px 0 20px rgba(88,166,255,.70);

  transform:
    rotateY(28deg)
    rotateZ(-3deg);
}


/* RIGHT STRAND */

.dna::after{
  right:15px;

  border-right:9px solid #ff5fa2;

  box-shadow:
    2px 0 20px rgba(255,95,162,.65);

  transform:
    rotateY(-28deg)
    rotateZ(3deg);
}


/* DNA RUNG CONTAINER */

.rungs{
  position:absolute;
  inset:0;

  transform-style:preserve-3d;
}


/* DNA BASE PAIRS */

.rung{
  position:absolute;

  left:52px;

  width:116px;
  height:5px;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #58a6ff 0%,
      #9b78ff 45%,
      #ff5fa2 100%
    );

  box-shadow:
    0 0 13px rgba(150,105,255,.65);

  transform-origin:center;

  animation:
    rungMove 3.2s ease-in-out infinite;
}

  top:20px;
  animation-delay:0s;
}
